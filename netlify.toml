[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Снапшот занятости каждые 2 часа (было раз в день в 09:00 — к вечеру картина устаревала:
# 18.09 утром 26/35, днём 31/35). История не портится: прошлые даты функция не трогает.
[functions."occupancy-snapshot"]
  schedule = "0 */2 * * *"

# Утреннее сообщение горничным в Telegram (02:30 UTC = 07:30 Ташкент)
# morning-cleaning отключён 01.10.2026 — уборки ведёт housekeeping-бот (VPS). Мост броней к нему — hk-sync.
[functions."hk-sync"]
  schedule = "*/15 * * * *"

# Хаб каналов (11.10.2026): очередь цен/занятости → Channex каждую минуту (+ feed броней каждые 10 мин);
# iCal площадок без API (Яндекс Путешествия, Sutochno) → брони каждые 10 минут. env: CHANNEX_API_KEY, CHANNEX_BASE, CHANNEX_WEBHOOK_SECRET.
[functions."channel-push"]
  schedule = "* * * * *"
[functions."ical-pull"]
  schedule = "*/2 * * * *"

# Booking.com на проде Channex (15.10.2026): пока Booking не пушит новые брони новому провайдеру — опрашиваем
# load_future_reservations по всем Booking-каналам каждые 3 минуты (booking-pull.js). Channex сам опрашивает Booking ~раз в 40 мин
# (Ack Bookings в логах), push от Booking к Channex не включён — запрошено у Channex. Убрать/реже, когда push заработает.
[functions."booking-pull"]
  schedule = "*/3 * * * *"

# Брони из RealtyCalendar → своя таблица bookings (07.10.2026). Нужен RC_TOKEN.
[functions."rc-sync"]
  schedule = "7,22,37,52 * * * *"

# Мультиязычные URL: /en и /uz отдаются функцией lang.js (один источник — index.html).
# Язык передаём через путь, а не query: Netlify теряет query-строку в rewrite-цели.
[[redirects]]
  from = "/en"
  to = "/.netlify/functions/lang/en"
  status = 200

[[redirects]]
  from = "/uz"
  to = "/.netlify/functions/lang/uz"
  status = 200

# Корпоративная страница (24.09.2026): /corporate → corporate.html, /corporate/en — английская версия
[[redirects]]
  from = "/corporate/en"
  to = "/corporate.html?lang=en"
  status = 200

[[redirects]]
  from = "/corporate"
  to = "/corporate.html"
  status = 200

[[redirects]]
  from = "/ops"
  to = "/ops.html"
  status = 200

# PMS — шахматка, брони, гости, цены (11.10.2026)
[[redirects]]
  from = "/pms"
  to = "/pms.html"
  status = 200

# Админка v4 (14.10.2026): /admin → public/admin/index.html. Этап 7 (14.10): старые панели admin.html / admin2 / admin3
# вынесены из public в legacy/ (не деплоятся), все их адреса ведут на /admin. force = true — чтобы файл не перехватывал адрес.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/admin-legacy.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/admin2.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/admin2"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/admin3"
  to = "/admin#finance"
  status = 301
  force = true

[[redirects]]
  from = "/admin3.html"
  to = "/admin#finance"
  status = 301
  force = true

[[redirects]]
  from = "/map"
  to = "/map.html"
  status = 200

# Страница бронера «что свободно» (28.09.2026)
[[redirects]]
  from = "/free"
  to = "/free.html"
  status = 200

# SEO-страницы апартаментов: /apartments и /apartments/<id> собираются функцией
# apt-page.js из Supabase (настоящие индексируемые страницы вместо /?apt=...).
[[redirects]]
  from = "/apartments"
  to = "/.netlify/functions/apt-page/"
  status = 200

[[redirects]]
  from = "/apartments/*"
  to = "/.netlify/functions/apt-page/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
