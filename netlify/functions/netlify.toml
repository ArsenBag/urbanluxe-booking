[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Снапшот занятости каждые 2 часа (было раз в день в 09:00 — к вечеру картина устаревала:
# 18.09 утром 26/35, днём 31/35). История не портится: прошлые даты функция не трогает.
[functions."occupancy-snapshot"]
  schedule = "0 */2 * * *"

# Утреннее сообщение горничным в Telegram (02:30 UTC = 07:30 Ташкент)
[functions."morning-cleaning"]
  schedule = "30 2 * * *"

# Мультиязычные URL: /en и /uz отдаются функцией lang.js (один источник — index.html).
# Язык передаём через путь, а не query: Netlify теряет query-строку в rewrite-цели.
[[redirects]]
  from = "/en"
  to = "/.netlify/functions/lang/en"
  status = 200

[[redirects]]
  from = "/uz"
  to = "/.netlify/functions/lang/uz"
  status = 200

# Корпоративная страница (24.09.2026): /corporate → corporate.html, /corporate/en — английская версия
[[redirects]]
  from = "/corporate/en"
  to = "/corporate.html?lang=en"
  status = 200

[[redirects]]
  from = "/corporate"
  to = "/corporate.html"
  status = 200

# Страница бронера «что свободно» (28.09.2026)
[[redirects]]
  from = "/free"
  to = "/free.html"
  status = 200

# SEO-страницы апартаментов: /apartments и /apartments/<id> собираются функцией
# apt-page.js из Supabase (настоящие индексируемые страницы вместо /?apt=...).
[[redirects]]
  from = "/apartments"
  to = "/.netlify/functions/apt-page/"
  status = 200

[[redirects]]
  from = "/apartments/*"
  to = "/.netlify/functions/apt-page/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
