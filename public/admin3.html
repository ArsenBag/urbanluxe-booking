<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Urban Luxe · Админка 3</title>
<link rel="icon" href="/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--bg:#0e0f12;--panel:#16181d;--panel2:#1d2027;--line:#262a33;--text:#e8e6e1;--muted:#8b909c;--gold:#c9a45c;--green:#39b36c;--red:#e5533d;--blue:#4c8dff;--amber:#e0a63a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,Segoe UI,Roboto,Inter,sans-serif}
a{color:var(--gold);text-decoration:none}button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.login{min-height:100%;display:flex;align-items:center;justify-content:center}.login .box{width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}.login h1{margin:0 0 4px;font-size:20px;letter-spacing:.12em;color:var(--gold)}.login p{margin:0 0 18px;color:var(--muted)}.login input{width:100%;margin:6px 0 12px}
.btn{background:var(--gold);color:#111;border:0;border-radius:8px;padding:9px 14px;font-weight:600}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:12px}.btn.red{background:var(--red);color:#fff}
.app{display:none;min-height:100%}.app.on{display:grid;grid-template-columns:220px 1fr}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.nav .logo{color:var(--gold);letter-spacing:.14em;font-weight:700;padding:4px 10px 16px;font-size:15px}.nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--text);margin:2px 0}.nav a.on,.nav a:hover{background:var(--panel2);color:var(--gold)}.nav .me{margin-top:18px;padding:10px 12px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.main{padding:22px 26px;min-width:0}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top h2{margin:0;font-size:20px;font-weight:600;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.card .l{color:var(--muted);font-size:12px}.card .v{font-size:22px;font-weight:600;margin-top:4px}.card .d{font-size:12px;margin-top:2px;color:var(--muted)}.up{color:var(--green)}.down{color:var(--red)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}.panel h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}.app.on{grid-template-columns:1fr}.nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}.nav .logo{width:100%}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}td:first-child,th:first-child{text-align:left}tr:hover td{background:rgba(255,255,255,.02)}.tbl{overflow:auto;max-height:70vh}
.tag{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;background:var(--panel2);color:var(--muted)}.tag.partner{color:#f0c27b;background:rgba(201,164,92,.15)}.tag.management{color:#7fb4ff;background:rgba(76,141,255,.15)}.tag.sublease{color:#9fd8b4;background:rgba(57,179,108,.12)}.tag.live{color:var(--blue)}.tag.manual{color:var(--amber)}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.muted{color:var(--muted)}.right{text-align:right}.pos{color:var(--green)}.neg{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}.modal.on{display:flex}.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,94vw);max-height:90vh;overflow:auto}.modal h3{margin:0 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.form .w{grid-column:1/-1}.form input,.form select,.form textarea{width:100%}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:10px;display:none;z-index:60}.toast.on{display:block}
.mini{height:220px}.heat td{padding:3px;text-align:center}.heat i{display:block;width:16px;height:16px;border-radius:3px;background:var(--panel2)}.heat i.b{background:var(--gold)}
.kpi-note{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="login" id="login"><div class="box"><h1>URBAN LUXE</h1><p>Админка 3 · финансы и операции</p><div id="loginErr" class="neg" style="display:none;margin-bottom:8px"></div><label class="muted">Email</label><input id="email" type="email" autocomplete="username"><label class="muted">Пароль</label><input id="pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="btn" style="width:100%" onclick="login()">Войти</button></div></div>

<div class="app" id="app">
  <nav class="nav">
    <div class="logo">URBAN LUXE · 3</div>
    <a href="#dash" data-v="dash">Дашборд</a>
    <a href="#pl" data-v="pl">P&amp;L</a>
    <a href="#apts" data-v="apts">Квартиры</a>
    <a href="#exp" data-v="exp">Расходы</a>
    <a href="#partners" data-v="partners">Партнёры</a>
    <a href="#mkt" data-v="mkt">Маркетинг</a>
    <a href="#ops" data-v="ops">Операционка</a>
    <a href="#settings" data-v="settings">Настройки</a>
    <div class="me"><div id="meName"></div><a href="#" onclick="logout();return false">Выйти</a> · <a href="/admin.html">старая админка</a></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://sebvfvtofiysbywxjqut.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlYnZmdnRvZml5c2J5d3hqcXV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjgzNjIsImV4cCI6MjA5MTkwNDM2Mn0.Pk5C4mwyJNpWRSz30V-F6I-0qGs0If6FRhg8tM5mBcI';
const sb=supabase.createClient(SB_URL,SB_KEY);
const API='/.netlify/functions/admin3-api';
let ME=null, APTS=[], CATS=[], PARTNERS=[], charts={};
const $=s=>document.querySelector(s), main=$('#main');
const fmt=v=>v==null||isNaN(v)?'—':'$'+Math.round(v).toLocaleString('ru-RU');
const fmt1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10).toLocaleString('ru-RU');
const pct=v=>v==null||isNaN(v)?'—':Math.round(v)+'%';
const cls=v=>v>0?'pos':v<0?'neg':'';
const MONTHS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const mlabel=ym=>{const [y,m]=ym.split('-');return MONTHS[+m-1]+' '+y.slice(2)};
const thisMonth=()=>{const d=new Date(Date.now()+5*36e5);return d.toISOString().slice(0,7)};
const addM=(ym,k)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+k,1));return d.toISOString().slice(0,7)};
let MONTH=thisMonth();
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.borderColor=bad?'var(--red)':'var(--line)';e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}

async function token(){const {data:{session}}=await sb.auth.getSession();return session?session.access_token:null}
async function api(params,body){const t=await token();if(!t){showLogin();throw new Error('no session')}
  const r=await fetch(API+(body?'':'?'+new URLSearchParams(params)),{method:body?'POST':'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:'bad json'}));if(!r.ok||j.error){if(r.status===401)showLogin();throw new Error(j.error||r.status)}return j}

async function login(){const er=$('#loginErr');er.style.display='none';const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(error){er.textContent=error.message;er.style.display='block';return}boot()}
async function logout(){await sb.auth.signOut();showLogin()}
function showLogin(){$('#login').style.display='flex';$('#app').classList.remove('on')}
async function boot(){try{ME=await api({a:'me'})}catch(e){showLogin();return}
  $('#login').style.display='none';$('#app').classList.add('on');$('#meName').textContent=ME.name+' · '+ME.role;
  [APTS,CATS,PARTNERS]=await Promise.all([api({a:'apts'}),api({a:'categories'}),api({a:'partners'})]);
  route()}
window.addEventListener('hashchange',route);
function route(){const v=(location.hash||'#dash').slice(1).split('?')[0];document.querySelectorAll('.nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v));(VIEWS[v]||VIEWS.dash)()}
function monthPicker(){return `<input type="month" value="${MONTH}" onchange="MONTH=this.value;route()">`}
function killCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={}}
function chart(id,cfg){charts[id]=new Chart(document.getElementById(id),cfg)}
Chart.defaults.color='#8b909c';Chart.defaults.borderColor='#262a33';Chart.defaults.font.size=11;

const VIEWS={};

// ---------------- ДАШБОРД ----------------
VIEWS.dash=async()=>{killCharts();main.innerHTML='<div class="top"><h2>Дашборд</h2><span class="muted">загрузка…</span></div>';
  const d=await api({a:'dashboard'});const c=d.current||{},p=d.previous||{};
  const delta=(a,b)=>b?`<span class="${cls(a-b)}">${a-b>=0?'+':''}${Math.round(100*(a-b)/Math.abs(b))}%</span> к ${mlabel(p.month)}`:'';
  main.innerHTML=`<div class="top"><h2>Дашборд · ${mlabel(d.month)}</h2><span class="muted">сегодня ${d.today}</span></div>
  <div class="cards">
    <div class="card"><div class="l">Выручка за месяц</div><div class="v">${fmt(c.revenue)}</div><div class="d">${delta(c.revenue,p.revenue)}</div></div>
    <div class="card"><div class="l">Валовая прибыль (−аренда, −комиссии)</div><div class="v">${fmt(c.gross)}</div><div class="d">${c.revenue?pct(100*c.gross/c.revenue)+' маржа':''}</div></div>
    <div class="card"><div class="l">Расходы (opex)</div><div class="v">${fmt(c.expenses_opex)}</div><div class="d">capex ${fmt(c.expenses_capex)}</div></div>
    <div class="card"><div class="l">Результат UL (после доли партнёров)</div><div class="v ${cls(c.net)}">${fmt(c.net)}</div><div class="d">партнёрам ${fmt(c.partner_share)}</div></div>
    <div class="card"><div class="l">Загрузка · квартир</div><div class="v">${pct(d.apartments.occupancy)} · ${d.apartments.active}</div><div class="d">${c.partner_apartments||0} партнёрских</div></div>
    <div class="card"><div class="l">Долги гостей</div><div class="v ${d.ops.debt>0?'neg':''}">${fmt(d.ops.debt)}</div><div class="d">заездов сегодня ${d.ops.checkins_today} · выездов ${d.ops.checkouts_today}</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Выручка, аренда и результат по месяцам</h3><canvas id="chSeries" height="110"></canvas></div>
    <div class="panel"><h3>Загрузка на 14 дней</h3><canvas id="chOcc" class="mini"></canvas><div class="kpi-note">по данным RealtyCalendar/сайта на сейчас</div></div>
  </div>
  <div class="grid3">
    <div class="panel"><h3>Топ квартир месяца</h3><table>${d.top.map(r=>`<tr><td>${esc(r.short)}</td><td>${fmt(r.revenue)}</td><td class="${cls(r.net)}">${fmt(r.net)}</td><td>${pct(r.occupancy)}</td></tr>`).join('')}</table></div>
    <div class="panel"><h3>Слабые квартиры</h3><table>${d.bottom.map(r=>`<tr><td>${esc(r.short)}</td><td>${fmt(r.revenue)}</td><td class="${cls(r.net)}">${fmt(r.net)}</td><td>${pct(r.occupancy)}</td></tr>`).join('')}</table></div>
    <div class="panel"><h3>Должники</h3><table>${d.ops.debtors.length?d.ops.debtors.map(x=>`<tr><td>${esc(x.apt)} · ${esc(x.guest||'')}</td><td>${x.date}</td><td class="neg">${fmt(x.due)}</td></tr>`).join(''):'<tr><td class="muted">нет</td></tr>'}</table>
    <h3 style="margin-top:14px">Маркетинг за месяц</h3><div>${fmt(d.marketing.amount)} · TG-кликов ${d.marketing.tg} · заявок ${d.marketing.leads}</div></div>
  </div>`;
  const s=d.series;
  chart('chSeries',{type:'bar',data:{labels:s.map(x=>mlabel(x.month)),datasets:[{label:'Выручка',data:s.map(x=>x.revenue),backgroundColor:'rgba(201,164,92,.75)'},{label:'Аренда',data:s.map(x=>x.rent),backgroundColor:'rgba(139,144,156,.5)'},{label:'Результат UL',data:s.map(x=>x.net),type:'line',borderColor:'#39b36c',tension:.3,yAxisID:'y'}]},options:{plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}});
  chart('chOcc',{type:'bar',data:{labels:d.occupancy14.map(x=>x.date.slice(8)+'.'+x.date.slice(5,7)),datasets:[{data:d.occupancy14.map(x=>x.pct),backgroundColor:d.occupancy14.map(x=>x.pct>=75?'#39b36c':x.pct>=50?'#c9a45c':'#e5533d')}]},options:{plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}});
};

// ---------------- P&L ----------------
VIEWS.pl=async()=>{killCharts();const from=addM(MONTH,-11);main.innerHTML=`<div class="top"><h2>P&amp;L</h2>${monthPicker()}<span class="muted">12 месяцев до выбранного</span></div><div class="muted">загрузка…</div>`;
  const d=await api({a:'pl',from,to:MONTH});const M=d.months;
  const cats=d.categories.filter(c=>M.some(m=>(m.by_category[c.code]||0)!==0));
  const row=(label,f,cl)=>`<tr><td>${label}</td>${M.map(m=>`<td class="${cl?cl(f(m)):''}">${fmt(f(m))}</td>`).join('')}</tr>`;
  main.innerHTML=`<div class="top"><h2>P&amp;L</h2>${monthPicker()}<button class="btn ghost sm" onclick="openFinance()">+ выручка вручную</button><button class="btn ghost sm" onclick="importSheets()">⟳ обновить из Google-таблиц</button><button class="btn ghost sm" onclick="exportCSV()">CSV</button></div>
  <div class="panel"><canvas id="chPL" height="90"></canvas></div>
  <div class="panel tbl"><table id="plTable"><thead><tr><th>Статья</th>${M.map(m=>`<th>${mlabel(m.month)}</th>`).join('')}</tr></thead><tbody>
  <tr><td>Квартир / ночей</td>${M.map(m=>`<td class="muted">${m.apartments} / ${m.nights||'—'}</td>`).join('')}</tr>
  ${row('<b>Выручка</b>',m=>m.revenue)}
  ${row('Аренда собственникам',m=>-m.rent)}
  ${row('Комиссии площадок',m=>-m.commission)}
  ${row('<b>Валовая прибыль</b>',m=>m.gross,cls)}
  ${cats.filter(c=>!['dividend','credit','rent'].includes(c.kind)).map(c=>row('&nbsp;&nbsp;'+esc(c.name_ru),m=>-(m.by_category[c.code]||0))).join('')}
  ${row('<b>EBITDA</b>',m=>m.ebitda,cls)}
  ${row('Доля партнёров (50/50)',m=>-m.partner_share)}
  ${row('<b>Результат Urban Luxe</b>',m=>m.net,cls)}
  <tr><td class="muted">Маржа UL</td>${M.map(m=>`<td class="muted">${m.revenue?pct(100*m.net/m.revenue):'—'}</td>`).join('')}</tr>
  ${row('Дивиденды',m=>-m.dividends)}${row('Кредит',m=>-m.credit)}
  <tr><td class="muted">Источник выручки</td>${M.map(m=>`<td class="muted" style="font-size:11px">${Object.entries(m.sources).map(([k,v])=>k+':'+v).join(' ')||'—'}</td>`).join('')}</tr>
  </tbody></table></div>
  <div class="kpi-note">Выручка: ручная запись → импорт из Google-таблиц → живые данные листа заездов (payment_total по дате заезда). Аренда — из записи месяца или из условий квартиры. Расходы — журнал «Расходы». Доля партнёров — % от прибыли их квартир после аренды, комиссий и общих расходов.</div>`;
  chart('chPL',{type:'bar',data:{labels:M.map(x=>mlabel(x.month)),datasets:[{label:'Валовая',data:M.map(x=>x.gross),backgroundColor:'rgba(201,164,92,.7)'},{label:'Opex',data:M.map(x=>-x.expenses_opex),backgroundColor:'rgba(229,83,61,.6)'},{label:'Результат UL',data:M.map(x=>x.net),type:'line',borderColor:'#39b36c',tension:.3}]},options:{plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true},y:{stacked:true}}}});
  window.__pl=d;
};
async function importSheets(){toast('импорт…');try{const r=await api(null,{a:'import_sheets'});toast('Импортировано '+r.imported+' строк'+(r.unmapped.length?' · не сопоставлены: '+r.unmapped.join(', '):''));route()}catch(e){toast('Ошибка импорта: '+e.message,1)}}
function exportCSV(){const t=document.getElementById('plTable');if(!t)return;const rows=[...t.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>'"'+td.innerText.replace(/"/g,'""')+'"').join(';'));const b=new Blob(['﻿'+rows.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pl.csv';a.click()}

// ---------------- КВАРТИРЫ ----------------
VIEWS.apts=async()=>{killCharts();main.innerHTML=`<div class="top"><h2>Квартиры</h2>${monthPicker()}</div><div class="muted">загрузка…</div>`;
  const d=await api({a:'apartments',month:MONTH});const t=d.totals;
  const tag=m=>`<span class="tag ${m}">${{sublease:'субаренда',partner:'партнёр',management:'управление',own:'своя'}[m]||m}</span>`;
  main.innerHTML=`<div class="top"><h2>Квартиры · ${mlabel(d.month)}</h2>${monthPicker()}<button class="btn ghost sm" onclick="openTerm()">+ условия</button></div>
  <div class="cards"><div class="card"><div class="l">Выручка</div><div class="v">${fmt(t.revenue)}</div></div><div class="card"><div class="l">Аренда</div><div class="v">${fmt(t.rent)}</div><div class="d">${t.revenue?pct(100*t.rent/t.revenue)+' от выручки':''}</div></div><div class="card"><div class="l">Валовая</div><div class="v">${fmt(t.gross)}</div></div><div class="card"><div class="l">Доля UL</div><div class="v">${fmt(t.ul)}</div></div><div class="card"><div class="l">Загрузка</div><div class="v">${pct(t.occupancy)}</div><div class="d">${t.active} активных</div></div></div>
  <div class="panel tbl"><table><thead><tr><th>Квартира</th><th>Модель</th><th>Аренда</th><th>Выручка</th><th>Комис.</th><th>Расходы</th><th>Чистыми</th><th>Доля UL</th><th>Загрузка</th><th>RevPAR</th><th>ADR</th><th>3 мес</th><th>Источник</th><th></th></tr></thead><tbody>
  ${d.rows.map(r=>`<tr><td><a href="#apt?${r.id||''}" onclick="${r.id?`openApt('${r.id}');return false`:'return false'}">${esc(r.short)}</a> <span class="muted">${esc(r.rooms||'')}</span>${r.is_active===false?' <span class="tag">не на сайте</span>':''}</td>
   <td>${tag(r.model)}${r.partner?`<div class="muted" style="font-size:11px">${esc(r.partner)} ${r.partner_share||50}%</div>`:''}</td>
   <td>${fmt(r.rent)}</td><td><b>${fmt(r.revenue)}</b></td><td>${fmt(r.commission)}</td><td>${fmt(r.expenses)}</td><td class="${cls(r.net)}">${fmt(r.net)}</td><td class="${cls(r.ul_share)}">${fmt(r.ul_share)}</td>
   <td>${r.occupancy==null?'—':`<div style="min-width:70px">${pct(r.occupancy)}<div class="bar"><i style="width:${r.occupancy}%"></i></div></div>`}</td><td>${fmt(r.revpar)}</td><td>${fmt(r.adr)}</td>

  <tr><th>Итого</th>${months.map(m=>{let a=0,t=0;ch.forEach(c=>{const v=byM[m+'|'+c];if(v){a+=v.amount;t+=v.tg}});return `<th>${fmt(a)}</th><th>${t}</th><th>${t?fmt1(a/t):'—'}</th>`}).join('')}</tr></tbody></table>
  <div class="kpi-note">Вносите расход по каналам раз в неделю (или скрипт из кабинетов). TG-клики — цель TG_CLICK в Метрике/Meta/Google. Сделки закрываются в Telegram, поэтому главный KPI — цена TG-клика и брони по хэштегам #сайт/#meta.</div></div>
  <div class="panel"><h3>Записи</h3><div style="max-height:60vh;overflow:auto"><table>${list.map(x=>`<tr><td>${x.spend_date}</td><td>${cn[x.channel]}</td><td class="muted">${esc(x.campaign||'')}</td><td>${fmt(x.amount_usd)}</td><td>${x.tg_clicks} tg</td><td><button class="btn ghost sm" onclick="delMkt('${x.id}')">✕</button></td></tr>`).join('')||'<tr><td class="muted">нет записей</td></tr>'}</table></div></div></div>`;
};
function openMkt(){openModal(`<h3>Расход на рекламу</h3><div class="form"><div><label>Дата</label><input id="k_date" type="date" value="${new Date(Date.now()+5*36e5).toISOString().slice(0,10)}"></div><div><label>Канал</label><select id="k_ch"><option value="yandex">Яндекс Директ</option><option value="meta">Meta</option><option value="google">Google Ads</option><option value="instagram">Instagram</option><option value="telegram">Telegram</option><option value="other">Другое</option></select></div><div class="w"><label>Кампания</label><input id="k_camp"></div><div><label>Расход, $</label><input id="k_amt" type="number" step="0.01"></div><div><label>Показы</label><input id="k_imp" type="number"></div><div><label>Клики</label><input id="k_clk" type="number"></div><div><label>TG-клики</label><input id="k_tg" type="number"></div><div><label>Заявки</label><input id="k_leads" type="number"></div><div><label>Брони</label><input id="k_book" type="number"></div></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Отмена</button> <button class="btn" onclick="saveMkt()">Сохранить</button></div>`)}
async function saveMkt(){await api(null,{a:'marketing',spend_date:$('#k_date').value,channel:$('#k_ch').value,campaign:$('#k_camp').value,amount_usd:$('#k_amt').value,impressions:$('#k_imp').value,clicks:$('#k_clk').value,tg_clicks:$('#k_tg').value,leads:$('#k_leads').value,bookings:$('#k_book').value});closeModal();route()}
async function delMkt(id){if(!confirm('Удалить?'))return;await api(null,{a:'marketing_delete',id});route()}

// ---------------- ОПЕРАЦИОНКА ----------------
VIEWS.ops=async()=>{killCharts();main.innerHTML='<div class="top"><h2>Операционка</h2></div><div class="muted">загрузка…</div>';
  const d=await api({a:'ops'});
  const stay=o=>`<tr><td>${esc(o.short||o.apartment_id)}</td><td>${esc(o.guest_name||'')}</td><td class="muted">${esc(o.source||'')}</td><td>${esc(o.checkin_time||o.checkout_time||'')}</td><td>${fmt(o.payment_total)}</td><td class="${(+o.payment_paid||0)<(+o.payment_total||0)?'neg':'pos'}">${fmt(o.payment_paid)}</td><td>${o.passport?'🪪':''}${o.access?'🔑':''}${o.registration==='done'?'📋':''}${o.checked_in?'✅':''}${o.checked_out?'🚪':''}</td></tr>`;
  main.innerHTML=`<div class="top"><h2>Операционка · ${d.today}</h2><a class="btn ghost sm" href="/ops.html" target="_blank">лист заездов (Mini App)</a></div>
  <div class="grid3"><div class="panel"><h3>Заезды сегодня (${d.checkins.length})</h3><table>${d.checkins.map(stay).join('')||'<tr><td class="muted">нет</td></tr>'}</table></div>
  <div class="panel"><h3>Выезды сегодня (${d.checkouts.length})</h3><table>${d.checkouts.map(stay).join('')||'<tr><td class="muted">нет</td></tr>'}</table></div>
  <div class="panel"><h3>Завтра (${d.tomorrow.length})</h3><table>${d.tomorrow.map(stay).join('')||'<tr><td class="muted">нет</td></tr>'}</table></div></div>
  <div class="panel"><h3>Уборки сегодня (${d.cleaning.length})</h3><table>${d.cleaning.map(c=>`<tr><td>${esc(c.short||c.apartment_id)}</td><td>${c.done?'✓ убрано':'—'}</td><td class="muted">${esc(c.hk_status||'')} ${esc(c.hk_maid||'')}</td></tr>`).join('')||'<tr><td class="muted">нет задач (housekeeping-бот ещё не подключён)</td></tr>'}</table></div>
  <div class="panel tbl"><h3>Занятость на 14 дней</h3><table class="heat"><thead><tr><th>Квартира</th>${d.days.map(x=>`<th>${x.slice(8)}</th>`).join('')}<th>%</th></tr></thead><tbody>${d.grid.map(g=>`<tr><td style="text-align:left">${esc(g.short)}</td>${g.days.map(v=>`<td><i class="${v?'b':''}"></i></td>`).join('')}<td>${pct(100*g.days.reduce((a,b)=>a+b,0)/14)}</td></tr>`).join('')}</tbody></table></div>`;
};

// ---------------- НАСТРОЙКИ ----------------
VIEWS.settings=async()=>{killCharts();const [users,terms]=await Promise.all([api({a:'users'}),api({a:'terms'})]);
  main.innerHTML=`<div class="top"><h2>Настройки</h2></div>
  <div class="grid2"><div class="panel"><h3>Доступ</h3><table>${users.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.name||'')}</td><td><span class="tag">${u.role}</span></td></tr>`).join('')}</table>
  ${ME.role==='admin'?`<div class="row" style="margin-top:10px"><input id="u_email" placeholder="email"><input id="u_name" placeholder="имя" style="width:120px"><select id="u_role"><option value="admin">admin</option><option value="manager" selected>manager</option><option value="viewer">viewer</option><option value="partner">partner</option></select><select id="u_partner"><option value="">партнёр —</option>${PARTNERS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn sm" onclick="addUser()">добавить</button></div><div class="kpi-note">Пользователь должен существовать в Supabase Auth (регистрация на сайте или через панель Supabase). Роль partner видит только отчёт своего партнёра.</div>`:''}</div>
  <div class="panel"><h3>Условия по квартирам (${terms.length})</h3><div style="max-height:60vh;overflow:auto"><table>${terms.map(t=>`<tr><td>${esc(aptShort(t.apartment_id))}</td><td><span class="tag ${t.model}">${t.model}</span></td><td>${fmt(t.rent)}</td><td>${t.partners?esc(t.partners.name):''}</td><td class="muted">${t.valid_from}</td><td><button class="btn ghost sm" onclick="openTerm('${t.apartment_id}','${t.id}')">✎</button></td></tr>`).join('')}</table></div></div></div>
  <div class="panel"><h3>Как это работает</h3><div class="muted" style="line-height:1.7">Выручка берётся автоматически из листа заездов бронеров (сумма «итого» по заездам месяца), история до октября 2026 — импорт из Google-таблиц «Юнит экономика» и «Партнёрские». Аренда и модель (субаренда / партнёр 50/50 / управление) — в «условиях» каждой квартиры. Расходы вносятся в журнале; отметка «50/50» вычитает расход из прибыли партнёрской квартиры. Отчёт партнёру формируется кнопкой «отчёт для партнёра» и печатается/сохраняется в PDF.</div></div>`;
};
async function addUser(){await api(null,{a:'user',email:$('#u_email').value,name:$('#u_name').value,role:$('#u_role').value,partner_id:$('#u_partner').value||null});toast('добавлен');route()}

function openModal(html){$('#modalBox').innerHTML=html;$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
sb.auth.getSession().then(({data:{session}})=>session?boot():showLogin());
</script>
