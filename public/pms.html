<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Urban Luxe · PMS</title>
<link rel="icon" href="/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* 12.10.2026 — стиль по образцу RealtyCalendar: белое поле без вертикальной сетки, тёмные цены по центру клетки, плотные цветные полосы с тёмным текстом */
:root{--bg:#fff;--card:#fff;--line:#dfe3e8;--line2:#eef0f3;--text:#1f2328;--muted:#6b7480;--faint:#9aa3ad;--gold:#b8923f;--blue:#1a6fd1;--green:#2f9e5b;--yellow:#e0a71e;--red:#d9463e;--grey:#8a919b;--cell:32px;--row:38px;--fs:11px;--aptw:180px;--r:6px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 -apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #c9d0d8;background:#fff;border-radius:var(--r);padding:6px 11px}button:hover{background:#f3f5f8}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}button.pri:hover{background:#155cb0}
button.sm{padding:4px 9px;font-size:12px}button.danger{color:var(--red);border-color:#f0c3c0}button:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid #c9d0d8;border-radius:var(--r);padding:6px 9px;background:#fff;min-width:0;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=date]{padding:5px 7px}textarea{width:100%;min-height:60px;resize:vertical}
.muted{color:var(--muted)}.b{font-weight:600}.right{text-align:right}.nowrap{white-space:nowrap}.hide{display:none!important}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
#login{max-width:340px;margin:14vh auto;background:#fff;padding:28px;border-radius:12px;border:1px solid var(--line)}
#login h1{font-size:18px;margin:0 0 14px}#login input{width:100%;margin:5px 0}#login button{width:100%;margin-top:10px;padding:9px}
#loginErr{color:var(--red);font-size:12px;margin-top:8px;display:none}
/* шапка */
#top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 14px;height:46px;flex-wrap:wrap}
#top .logo{font-weight:800;letter-spacing:.06em;font-size:13px;color:var(--gold);margin-right:6px}
#top .apps{display:flex;border:1px solid #c9d0d8;border-radius:var(--r);overflow:hidden;margin-right:10px}#top .apps a{padding:4px 10px;font-size:12px;color:var(--text);border-right:1px solid #c9d0d8}#top .apps a:last-child{border-right:0}#top .apps a:hover{background:#f3f5f8;text-decoration:none}#top .apps a.on{background:#1f2328;color:#fff;font-weight:600}
#top nav{display:flex;gap:2px}#top nav button{border:0;background:transparent;padding:7px 11px;border-radius:var(--r);color:var(--text);font-size:14px}#top nav button:hover{background:#eef3fb}#top nav button.on{background:#e3eefb;color:var(--blue);font-weight:600}
#top .sp{flex:1}#top .me{font-size:12px;color:var(--muted)}
#conn{font-size:11px;padding:2px 9px;border-radius:12px;background:#e5f5ea;color:#1f6f3f}#conn.off{background:#fdeeda;color:#8a5a00}
#tools{display:flex;gap:6px;align-items:center;padding:7px 14px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line)}
#tools .seg{display:flex;border:1px solid #c9d0d8;border-radius:var(--r);overflow:hidden}#tools .seg button{border:0;border-radius:0;padding:5px 9px}#tools .seg button.on{background:#e3eefb;color:var(--blue);font-weight:600}
#main{padding:0}
/* шахматка */
#wrap{position:relative;overflow:auto;height:calc(100vh - 94px);background:#fff}
#chess{cursor:default}#chess .c{cursor:cell}#chess.panning,#chess.panning *{cursor:grabbing!important;user-select:none}
#chess{position:relative;display:grid;grid-template-columns:var(--aptw) 1fr;width:max-content;min-width:100%}
.hd{position:sticky;top:0;z-index:30;background:#fff}
.hd-apt{position:sticky;left:0;z-index:35;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:46px;display:flex;align-items:flex-end;padding:4px 10px;font-size:12px;color:var(--muted)}
.hd-days{display:flex;height:46px;border-bottom:1px solid var(--line)}
.hd-day{width:var(--cell);flex:0 0 var(--cell);text-align:center;font-size:11px;color:var(--muted);padding-top:14px;position:relative}
.hd-day b{display:block;font-size:calc(var(--fs) + 2px);color:var(--text);font-weight:700;line-height:17px}.hd-day.we b,.hd-day.we{color:var(--red)}
.hd-day.today b{background:var(--blue);color:#fff;border-radius:6px;margin:0 6px}
.hd-day .mo{position:absolute;top:1px;left:3px;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.grp{grid-column:1/3;background:#f3f5f8;border-bottom:1px solid var(--line);padding:4px 0;font-size:12px;font-weight:700;color:var(--text);cursor:pointer}.grp .gt{position:sticky;left:10px;display:inline-block}
.grp span{color:var(--muted);font-weight:400;margin-left:6px}
.apt{position:sticky;left:0;z-index:20;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line2);height:var(--row);padding:3px 10px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.apt .n{font-weight:700;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--fs) + 1px)}.apt .s{font-size:calc(var(--fs) - 1px);color:var(--muted);white-space:nowrap}
.apt .no{display:inline-block;min-width:18px;text-align:center;color:var(--muted);font-weight:600;font-size:11px;margin-right:5px}
.row{position:relative;height:var(--row);border-bottom:1px solid var(--line2);display:flex}
.c{width:var(--cell);flex:0 0 var(--cell);height:100%;font-size:var(--fs);color:var(--text);display:flex;align-items:center;justify-content:center;position:relative;user-select:none;font-variant-numeric:tabular-nums}
.c.we{background:#fff6f6}.c.today{box-shadow:inset 2px 0 0 var(--blue)}.c.sel{background:#cfe0fb!important}
.c.closed{background:repeating-linear-gradient(135deg,#f0f1f3 0 4px,#e2e5e9 4px 8px)}.c.cta{background:repeating-linear-gradient(135deg,transparent 0 6px,#f6e8c8 6px 8px)}
.c .mn{position:absolute;top:1px;right:2px;font-size:9px;color:#b08a3a}.c .ov{color:var(--blue);font-weight:700}
.c .cl{position:absolute;left:50%;bottom:-3px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);z-index:3}.c .cl.ok{background:var(--green)}.c .cl.no{background:#e8a33d}.c .cl.plan{background:#fff;border:1.5px solid #b0b6bf}
.bar{position:absolute;top:4px;height:calc(var(--row) - 9px);border-radius:5px;color:#1f2328;font-size:var(--fs);padding:2px 7px;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:5;display:flex;flex-direction:column;justify-content:center;line-height:1.2;border:1px solid rgba(0,0,0,.08)}
/* 17.10.2026 — минимализм как в RealtyCalendar: полоса нейтральная, оплата линией снизу (зелёная на долю оплаченного, остаток красный),
   метка площадки кружком с буквой, имя мельче (видно и на однодневной брони), выехавшие серые */
.bar{padding:2px 5px 4px}.bar .t{font-weight:600;font-size:calc(var(--fs) - 1px);overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;min-width:0}.bar .t>span,.bar .t{white-space:nowrap}
.bar .s{font-size:calc(var(--fs) - 2px);color:#5b6572;overflow:hidden;text-overflow:ellipsis}
.bar .oi{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;color:#fff;font-size:8.5px;font-weight:800;font-style:normal;line-height:1;letter-spacing:0}
/* 17.10 (Арсен): цвета статусов как раньше, но приглушённые; серый — только выехавшие */
.bar.request{background:#fbefc2;border-color:#e6c766}.bar.confirmed{background:#f7d3d0;border-color:#e9b3ae}.bar.checked_in{background:#d2ecd6;border-color:#a9d6b1}.bar.checked_out{background:#e3e6ea;color:#5b6572}
.bar.blocked{background:repeating-linear-gradient(135deg,#9aa1ab 0 6px,#b8bec7 6px 12px);color:#1f2328}.bar.foreign{background:repeating-linear-gradient(135deg,#d6dae0 0 6px,#e8ebef 6px 12px);color:#4b5563;cursor:default}
.bar .pay{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--red);overflow:hidden}.bar .pay i{display:block;height:100%;background:#1f9d4e}.bar .pay.paid{background:#1f9d4e}
.bar.n1{padding:2px 2px 4px}.bar.n1 .t{gap:2px;font-size:calc(var(--fs) - 2px)}.bar.n1 .oi{width:10px;height:10px;font-size:7px}.bar.n1 .s{display:none}
.bar.cancelled{top:1px;height:7px;padding:0 4px;background:transparent;border:1px dashed var(--red);border-radius:3px;color:var(--red);z-index:4;font-size:8px;line-height:5px;opacity:.85}.bar.cancelled .t{font-size:8px;font-weight:600}.bar.cancelled .oi{width:7px;height:7px;font-size:5px}
#chess{position:relative}#colhl{position:absolute;top:46px;bottom:0;width:var(--cell);background:rgba(26,111,209,.07);pointer-events:none;z-index:3;display:none}
.hd-day.hl{background:#e8f0fe;border-radius:6px}.row.hl{background:rgba(26,111,209,.04)}.apt.hl{background:#eef4fd}.c:hover{background:rgba(26,111,209,.12)!important}
.bar.late{clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);padding-right:22px;border-right:0}.bar.early{clip-path:polygon(14px 0,100% 0,100% 100%,0 100%);padding-left:22px;border-left-width:0}
.bar.late.early{clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.bar .lt,.bar .et{position:absolute;top:2px;font-size:9px;font-weight:700;color:#7a1f1a;background:rgba(255,255,255,.75);border-radius:3px;padding:0 3px;line-height:12px}.bar .lt{right:16px}.bar .et{left:16px}
.bar.gap{box-shadow:inset 0 0 0 2px var(--red)}.bar.flash{animation:fl 1.6s ease-out}@keyframes fl{0%{box-shadow:0 0 0 4px #ffd666}100%{box-shadow:none}}
.bar:hover{filter:brightness(.96)}.bar.dragging{opacity:.5}.row.over{background:#eef5ff}
#pop{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:10px 12px;min-width:220px;font-size:12px}
#pop .big{font-size:16px;font-weight:700;margin:4px 0}#pop .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
/* панель */
#drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#fff;border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(0,0,0,.1);z-index:60;transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column}
#drawer.open{transform:none}#drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}#drawer .dh h3{margin:0;font-size:15px;flex:1}
#drawer .db{flex:1;overflow:auto;padding:14px 16px}#drawer .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:10px}.f label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}.f label.w{grid-column:1/3}.f input,.f select{width:100%}
.st{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;color:#1f2328;font-weight:600}
.sec{margin:14px 0 6px;font-size:12px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}.sec .sp{flex:1}
table.t{width:100%;border-collapse:collapse;font-size:12px}table.t td,table.t th{padding:6px 7px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}table.t th{color:var(--muted);font-weight:500;font-size:11px}table.t tr:hover td{background:#f7f9fc}
.ev{font-size:11px;color:#555;padding:4px 0;border-bottom:1px dashed #e5e7eb}.ev b{color:#222}.ev .muted{font-size:10px}
.hint{position:absolute;z-index:70;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:220px;overflow:auto;font-size:12px}.hint div{padding:6px 10px;cursor:pointer}.hint div:hover{background:#f3f5f8}
.tag{display:inline-block;background:#eef1f5;border-radius:6px;padding:1px 7px;font-size:11px;margin:1px 2px 1px 0}.tag.bad{background:#fde3e1;color:#9c1f17}.tag.vip{background:#f6e7b9;color:#6d5416}
.warn{background:#fdecec;border:1px solid #f3bdb8;color:#8a1f17;padding:7px 11px;border-radius:8px;margin:6px 0;font-size:12px}
/* страницы-списки */
.page{padding:14px;max-width:1100px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}.card h3{margin:0 0 10px;font-size:14px}
.li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);cursor:pointer}.li:last-child{border:0}.li:hover{background:#f7f9fc}.li .no{min-width:24px;text-align:center;color:var(--muted);font-weight:600;font-size:11px;padding:1px 3px}.li .g{flex:1;min-width:0}.li .g .n{font-weight:700}.li .g .s{font-size:11px;color:var(--muted)}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px;font-size:11px;color:var(--muted)}.kpi b{display:block;font-size:20px;color:var(--text);margin-bottom:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 14px;border-radius:10px;font-size:12px;z-index:90;display:none}
#tabs{display:none}
@media (max-width:760px){
  :root{--cell:32px;--row:40px;--aptw:120px}
  #top{padding:0 10px}#top nav{display:none}#tools{gap:4px;padding:6px 10px}#tools .desk{display:none}
  #wrap{height:calc(100vh - 140px)}
  #drawer{width:100vw}
  #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:45}
  #tabs button{flex:1;border:0;border-radius:0;padding:10px 4px;font-size:11px;background:transparent}#tabs button.on{color:var(--blue);font-weight:700}
  .page{padding:10px 10px 70px}
}
</style>
</head>
<body>
<div id="login" class="hide"><h1 id="loginTitle">Urban Luxe · PMS</h1>
  <div id="loginForm"><input id="email" type="email" placeholder="email" autocomplete="username"><input id="pass" type="password" placeholder="пароль" autocomplete="current-password"><button class="pri" onclick="login()">Войти</button><div style="margin-top:10px;font-size:12px"><a href="#" id="forgot">Забыли пароль?</a></div></div>
  <div id="inviteForm" class="hide"><div class="muted" style="font-size:13px;margin-bottom:8px" id="inviteInfo">проверяю приглашение…</div><input id="inv_name" placeholder="ваше имя"><input id="inv_p1" type="password" placeholder="пароль (от 6 символов)" autocomplete="new-password"><input id="inv_p2" type="password" placeholder="пароль ещё раз" autocomplete="new-password"><button class="pri" id="inv_ok">Задать пароль и войти</button></div>
  <div id="resetForm" class="hide"><div class="muted" style="font-size:13px;margin-bottom:8px">Новый пароль для входа</div><input id="rs_p1" type="password" placeholder="новый пароль (от 6 символов)" autocomplete="new-password"><input id="rs_p2" type="password" placeholder="ещё раз" autocomplete="new-password"><button class="pri" id="rs_ok">Сохранить и войти</button></div>
  <div id="loginErr"></div></div>
<div id="app" class="hide">
  <div id="top"><span class="logo">URBAN LUXE</span><div class="apps"><a class="on" href="/pms">PMS</a><a href="/admin" title="Дашборд, заявки, финансы, квартиры">Админка</a><a href="/map" title="Живая карта бизнеса">Карта</a><a href="https://crm.urbanluxe.cc" target="_blank" rel="noopener" title="CRM: клиенты, сделки, чаты Telegram/WhatsApp, задачи">CRM</a></div>
    <nav><button data-v="cal" class="on">Шахматка</button><button data-v="today">Сегодня</button><button data-v="free">Свободно</button><button data-v="guests">Гости</button><button data-v="debts">Долги</button><button data-v="rules">Цены</button><button data-v="partners">Партнёры</button><button data-v="channels">Каналы</button><button data-v="objects">Объекты</button><button data-v="report">Отчёт</button><button data-v="users">Сотрудники</button><button data-v="integrations">Интеграции</button><button data-v="orgs">Организации</button></nav>
    <span class="sp"></span><select id="orgsw" class="hide" title="Организация (кабинет)" style="font-size:12px;max-width:160px"></select><span id="conn">online</span><span class="me" id="me"></span><button class="sm" onclick="logout()">выйти</button></div>
  <div id="tools"></div>
  <div id="main"></div>
  <div id="tabs"><button data-v="today" class="on">Сегодня</button><button data-v="free">Свободно</button><button data-v="cal">Шахматка</button><button data-v="guests">Поиск</button></div>
</div>
<div id="drawer"><div class="dh"><h3 id="d_title">Бронь</h3><button class="sm" onclick="closeDrawer()">✕</button></div><div class="db" id="d_body"></div><div class="df" id="d_foot"></div></div>
<div id="toast"></div>
<script src="/pms.js?v=30"></script>
<script src="/pms-v2.js?v=8"></script>
</body>
</html>
